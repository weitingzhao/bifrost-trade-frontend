<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Three modes since design Rev 2026-09-23.11: dark · light · auto by the local clock.
         `class="dark"` above is the default when this script cannot run; the script picks the
         stored mode before the first paint so the ground never flashes. It mirrors
         `src/lib/theme.ts` (same key, same hours), and `theme.test.ts` pins the two together. -->
    <meta name="color-scheme" content="dark light" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('bifrost.theme');
          var h = new Date().getHours();
          var t = m === 'light' ? 'light' : m === 'auto' ? (h >= 7 && h < 19 ? 'light' : 'dark') : 'dark';
          var r = document.documentElement;
          r.classList.toggle('dark', t === 'dark');
          r.dataset.theme = t;
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bifrost Trade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
